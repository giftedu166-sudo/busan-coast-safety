name: Update KMA marine observations

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect current observations
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, math, os, time, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone

          key = os.environ['KMA_API_KEY']
          base = 'https://apihub.kma.go.kr/api/typ01/url/'

          def request(name, params, optional=False):
              params['authKey'] = key
              url = (name if name.startswith('http') else base + name) + '?' + urllib.parse.urlencode(params)
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'BusanCoastSafety/1.0'})
                      with urllib.request.urlopen(request, timeout=60) as response:
                          return response.read().decode('euc-kr', errors='replace')
                  except Exception:
                      if attempt == 2:
                          if optional: return ''
                          raise
                      time.sleep(5 * (attempt + 1))

          sea = request('sea_obs.php', {'tm': '0', 'stn': '0'})
          aws = request('https://apihub.kma.go.kr/api/typ01/cgi-bin/url/nph-aws2_min', {'tm2': '0', 'stn': '0', 'disp': '0'})
          now = datetime.now(timezone(timedelta(hours=9)))
          warnings = request('wrn_inf_rpt.php', {
              'tmfc1': (now - timedelta(days=1)).strftime('%Y%m%d%H%M'),
              'tmfc2': now.strftime('%Y%m%d%H%M'), 'stn': '0', 'disp': '0'
          }, optional=True)

          rows = {}
          for line in sea.splitlines():
              fields = [field.strip() for field in line.split(',')]
              if len(fields) >= 14 and fields[0] in {'B','C','D','L','N','F','G','J'}:
                  rows[fields[2]] = fields

          aws_rows = {}
          for line in aws.splitlines():
              fields = line.split()
              if len(fields) >= 15 and fields[0].isdigit() and len(fields[0]) == 12:
                  aws_rows[fields[1]] = fields

          def value(row, index):
              try:
                  number = float(row[index])
                  return None if number <= -90 else number
              except (IndexError, TypeError, ValueError):
                  return None

          oryukdo = rows.get('22459')
          dadaepo = rows.get('22460')
          gijang = rows.get('22511')
          if not (oryukdo and dadaepo and gijang):
              raise RuntimeError('Required Busan marine observation stations are unavailable')
          if not all(station in aws_rows for station in ('159', '937', '942', '950')):
              raise RuntimeError('Required Busan AWS observation stations are unavailable')

          def apparent_temperature(ta, humidity, wind):
              if None in (ta, humidity, wind): return ta
              vapor = humidity / 100 * 6.105 * math.exp(17.27 * ta / (237.7 + ta))
              return round(ta + .33 * vapor - .70 * wind - 4, 1)

          names = {
              'songjeong': '\uc1a1\uc815\ud574\uc218\uc695\uc7a5', 'dadaepo': '\ub2e4\ub300\ud3ec\ud574\uc218\uc695\uc7a5',
              'haeundae': '\ud574\uc6b4\ub300\ud574\uc218\uc695\uc7a5', 'gwangalli': '\uad11\uc548\ub9ac\ud574\uc218\uc695\uc7a5',
              'songdo': '\uc1a1\ub3c4\ud574\uc218\uc695\uc7a5'
          }
          def beach(name, marine, sea_station_name, aws_station_id, aws_station_name):
              aws_row = aws_rows[aws_station_id]
              wind = value(aws_row, 3)
              air = value(aws_row, 8)
              humidity = value(aws_row, 14)
              return {'region': names[name], 'observed_at': aws_row[0], 'water_temperature': value(marine, 10),
                      'wave_height': value(marine, 6), 'wind_speed': wind,
                      'apparent_temperature': apparent_temperature(air, humidity, wind), 'weather': '\ud574\uc0c1 \uad00\uce21',
                      'source': 'KMA sea observation + AWS', 'sea_station_name': sea_station_name,
                      'aws_station_name': aws_station_name, 'aws_station_id': aws_station_id}

          data = {'updated_at': now.isoformat(), 'source': 'KMA sea observation',
                  'weather_information_checked_at': now.isoformat(),
                  'weather_information_records': warnings.count('$0#'),
                  'stations': {'oryukdo': '22459', 'dadaepo': '22460', 'gijang': '22511', 'aws_haeundae': '937', 'aws_busan_namgu': '942', 'aws_saha': '950', 'aws_busan': '159'},
                  'beaches': {'songjeong': beach('songjeong', gijang, '\uae30\uc7a5 \ud574\uc0c1 \uad00\uce21\uc18c', '937', '\ud574\uc6b4\ub300 AWS'),
                              'dadaepo': beach('dadaepo', dadaepo, '\ub2e4\ub300\ud3ec \ud574\uc0c1 \uad00\uce21\uc18c', '950', '\uc0ac\ud558 AWS'),
                              'haeundae': beach('haeundae', oryukdo, '\uc624\ub959\ub3c4 \ud574\uc0c1 \uad00\uce21\uc18c', '937', '\ud574\uc6b4\ub300 AWS'),
                              'gwangalli': beach('gwangalli', oryukdo, '\uc624\ub959\ub3c4 \ud574\uc0c1 \uad00\uce21\uc18c', '942', '\ubd80\uc0b0\ub0a8\uad6c AWS'),
                              'songdo': beach('songdo', dadaepo, '\ub2e4\ub300\ud3ec \ud574\uc0c1 \uad00\uce21\uc18c', '159', '\ubd80\uc0b0 AWS')}}
          with open('data/realtime-data.json', 'w', encoding='utf-8') as file:
              json.dump(data, file, ensure_ascii=False, indent=2)
          PY
      - name: Commit updated observation data
        run: |
          if git diff --quiet -- data/realtime-data.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/realtime-data.json
          git commit -m "Update KMA marine observations"
          git push
