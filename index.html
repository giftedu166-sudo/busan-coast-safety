  <style>
    :root{--navy:#07364f;--blue:#087ea7;--sky:#eaf8fb;--bg:#f4fafb;--line:#d5e7ec;--ink:#152c36;--muted:#59717c;--orange:#d97818;--green:#19754f}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;padding-bottom:76px;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Noto Sans KR",sans-serif}.hero{padding:38px 20px 88px;background:linear-gradient(125deg,#062f46,#087fa9);color:#fff}.wrap{width:min(100%,1000px);margin:auto}.brand{font-weight:900;font-size:clamp(2.15rem,5vw,3.45rem);line-height:1.05;letter-spacing:-.07em}.brand b{color:#9cecf5}.eyebrow{margin-top:4px;color:#9cecf5;letter-spacing:.1em;font-size:clamp(.9rem,2vw,1.15rem);font-weight:850}h1{margin:28px 0 10px;font-size:clamp(2.15rem,5vw,3.6rem);line-height:1.16;letter-spacing:-.06em}.hero p{max-width:620px;margin:0}.bottom-nav{position:fixed;z-index:1000;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:min(11vw,96px);padding:8px 20px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #dfe7ea;background:#fffffff2;backdrop-filter:blur(12px);box-shadow:0 -3px 14px #07364f0a}.bottom-nav a{display:grid;place-items:center;gap:1px;min-width:42px;color:var(--ink);text-decoration:none}.nav-symbol{font-size:1.65rem;line-height:1}.bottom-nav small{font-size:.68rem;font-weight:800}.bottom-nav a:hover,.bottom-nav a:focus{color:var(--blue)}.main{width:min(calc(100% - 32px),1000px);margin:-42px auto 46px}.card{padding:clamp(20px,4vw,30px);border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 10px 25px #07364f0b;scroll-margin-top:18px}.title-row{display:flex;align-items:center;gap:10px}.title-row h2{margin:0;font-size:1.42rem;letter-spacing:-.04em}.icon{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--sky);color:var(--blue);font-weight:900}.intro{margin:7px 0 19px;color:var(--muted)}.updated{padding:10px 12px;border-radius:10px;background:#f5fafb;color:var(--muted);font-size:.86rem}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.metric{padding:15px;border:1px solid var(--line);border-radius:13px}.metric span{display:block;color:var(--muted);font-size:.84rem}.metric b{font-size:1.35rem}.metric small{display:block;margin-top:3px;color:var(--muted)}.risk{margin-top:18px;background:linear-gradient(135deg,#fff,#e8f8fa)}.risk-top{display:flex;justify-content:space-between;align-items:start;gap:20px}.risk-top h2{margin:0}.risk-top p{margin:5px 0;color:var(--muted)}.pending{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff2dc;color:#875200;font-size:.85rem;font-weight:800}.score{font-size:2.5rem;font-weight:900;line-height:1;color:var(--orange)}.rule-box{margin-top:20px;padding:18px;border-radius:13px;background:#fff;border:1px dashed #8bc4d3}.rule-box h3{margin:0 0 6px;font-size:1rem}.rule-box p{margin:0;color:var(--muted);font-size:.92rem}.rule-list{padding-left:20px;margin:10px 0 0;color:var(--muted);font-size:.9rem}.notice{margin-top:18px;padding:13px;border-left:5px solid var(--blue);background:var(--sky);color:#31535f;font-size:.9rem}footer{text-align:center;padding:20px;color:var(--muted);font-size:.8rem}@media(max-width:650px){.hero{padding-top:28px}.main{margin-top:-28px}.metrics{grid-template-columns:1fr 1fr}.risk-top{display:block}.score{margin-top:16px}}
    .beach-label{display:block;margin-bottom:6px;font-size:.9rem;font-weight:800}.beach-select{width:min(100%,360px);padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
    .beach-control{display:flex;gap:8px;align-items:center}.query-button{padding:11px 17px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}.metric.safe{border-color:#85d3aa;background:#effbf4}.metric.caution{border-color:#efb36d;background:#fff5e8}.metric.danger{border-color:#efa29e;background:#fff3f2}
    .wind-mark,.alert-symbol{display:inline-grid;place-items:center;width:20px;height:20px;margin-left:5px;border-radius:50%;background:#d66722;color:#fff;font-size:.78rem;font-weight:900;vertical-align:middle}.wind-guide{margin-top:16px;border:1px solid #f0c38a;border-radius:13px;background:#fffaf2;overflow:hidden}.wind-guide summary{display:flex;align-items:center;gap:7px;padding:13px 15px;cursor:pointer;font-weight:900;color:#754000}.wind-guide summary::-webkit-details-marker{display:none}.wind-guide p{margin:0;padding:0 15px 12px;color:#705b43;font-size:.9rem}.wind-guide img{display:block;width:100%;border-top:1px solid #f0c38a}.jellyfish-level{display:inline-block;padding:6px 11px;border-radius:999px;font-weight:900}.jellyfish-low{background:#e8f8ed;color:#176740}.jellyfish-caution{background:#fff0d8;color:#965700}.jellyfish-high{background:#ffe4e1;color:#a33128}
    .metric.wind-metric{position:relative}.metric.wind-metric .wind-mark{position:absolute;top:9px;right:9px;margin:0;box-shadow:0 2px 6px #9a3c1740}.jellyfish-panel,.report-panel{margin-top:18px;padding:18px;border-radius:14px;border:1px solid var(--line);background:#fff}.jellyfish-panel{background:linear-gradient(135deg,#effcff,#fff)}.panel-kicker{margin:0 0 5px;color:var(--blue);font-size:.82rem;font-weight:900}.jellyfish-panel h3,.report-panel h3{margin:0;font-size:1.13rem}.jellyfish-panel p,.report-panel p{margin:5px 0;color:var(--muted)}.report-panel{border-color:#f1d0b0}.report-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.demo-tag{padding:4px 8px;border-radius:999px;background:#fff0d8;color:#955200;font-size:.78rem;font-weight:900;white-space:nowrap}.report-status{margin-top:14px;padding:14px;border-left:5px solid #e47a26;background:#fffaf4}.report-status strong{display:block;font-size:1.02rem}.report-meta{margin-top:7px;font-size:.9rem;color:#5d5147}.report-button,.location-button{margin-top:14px;padding:10px 13px;border:0;border-radius:9px;background:#8d4310;color:#fff;font-weight:800;cursor:pointer}.location-button{margin-left:6px;background:#0c6d8d}.location-status{margin-top:12px;padding:12px;border-radius:10px;background:#eef9fc;color:#31535f;font-size:.9rem}.location-map{height:260px;margin-top:12px;border:1px solid #b8d6e1;border-radius:11px;overflow:hidden}.gps-pin{display:block;width:24px;height:24px;border-radius:50% 50% 50% 0;background:#e97520;border:3px solid #fff;box-shadow:0 2px 6px #7d360a80;transform:rotate(-45deg)}.gps-pin::after{content:"";display:block;width:7px;height:7px;margin:5px;border-radius:50%;background:#fff}.report-guide{margin:15px 0 0;padding-left:20px;color:var(--muted);font-size:.88rem}

<body>
  <header class="hero" id="home"><div class="wrap"><div class="brand" id="brand"></div><div class="eyebrow">BUSAN COAST SAFETY</div><h1 id="headline"></h1><p id="subheadline"></p></div></header>
  <main class="main">
    <section class="card" id="weather-section"><div class="title-row"><div class="icon">1</div><h2 id="weatherTitle"></h2></div><p class="intro" id="weatherIntro"></p><label class="beach-label" for="beachSelect" id="beachLabel"></label><div class="beach-control"><select id="beachSelect" class="beach-select"></select><button id="queryButton" class="query-button"></button></div><div class="updated" id="updated"></div><div class="metrics" id="metrics"></div><details class="wind-guide"><summary><span class="alert-symbol">!</span>풍속 위험 정보</summary><p id="windInfo"></p><img src="./assets/wind-speed-guide.png" alt="풍속 단계별 바람 세기 안내 그림"></details><div class="notice" id="dataNotice"></div></section>
    <section class="card risk" id="jellyfish-section"><div class="title-row"><div class="icon">2</div><h2>수온 기반 해파리 주의 안내</h2></div><div class="jellyfish-panel" id="jellyfishPanel"></div><div class="report-panel"><div class="report-top"><div><p class="panel-kicker">선택 해수욕장 신고 상태</p><h3 id="reportTitle"></h3></div><span class="demo-tag">시연용</span></div><div class="report-status" id="reportStatus"></div><button class="report-button" id="reportButton" type="button">신고 시연 보기</button><button class="location-button" id="locationButton" type="button">내 위치 확인</button><div class="location-status" id="locationStatus">현재 위치를 저장하지 않습니다.</div><div class="location-map" id="reportMap" aria-label="현재 위치와 신고 시연 위치 지도"></div><ul class="report-guide"><li>신고 1건: 제보 확인 중으로 표시</li><li>서로 다른 이용자의 신고가 2건 이상: 다중 제보 및 입수 주의로 표시</li><li>실제 신고 기능은 Firebase 연결 후에만 반영됩니다.</li></ul></div></section>
  </main><footer id="footer"></footer><nav class="bottom-nav" aria-label="주요 메뉴"><a href="#weather-section" aria-label="기상 해양 상황"><span class="nav-symbol">☀</span><small>기상</small></a><a href="#jellyfish-section" aria-label="해파리 안내"><span class="nav-symbol">🪼</span><small>해파리</small></a></nav>
  <script src="./kma-api-config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    // The only input source for the site: current weather and ocean observations.
    const beaches={
      songjeong:{name:'\uc1a1\uc815\ud574\uc218\uc695\uc7a5',lat:35.1786,lng:129.2005,sample:{water_temperature:26.8,wave_height:.9,wind_speed:5.6,apparent_temperature:30,weather:'\ub9d1\uc74c'}},
      dadaepo:{name:'\ub2e4\ub300\ud3ec\ud574\uc218\uc695\uc7a5',lat:35.0473,lng:128.9657,sample:{water_temperature:25.8,wave_height:.5,wind_speed:3.6,apparent_temperature:29,weather:'\ub9d1\uc74c'}},
      haeundae:{name:'\ud574\uc6b4\ub300\ud574\uc218\uc695\uc7a5',lat:35.1588,lng:129.1603,sample:{water_temperature:27.4,wave_height:1.4,wind_speed:8.2,apparent_temperature:32,weather:'\ub9d1\uc74c'}},
      gwangalli:{name:'\uad11\uc548\ub9ac\ud574\uc218\uc695\uc7a5',lat:35.1532,lng:129.1187,sample:{water_temperature:26.7,wave_height:.8,wind_speed:5.1,apparent_temperature:30,weather:'\uad6c\ub984 \uc870\uae08'}},
      songdo:{name:'\uc1a1\ub3c4\ud574\uc218\uc695\uc7a5',lat:35.0779,lng:129.0204,sample:{water_temperature:26.2,wave_height:.7,wind_speed:4.4,apparent_temperature:29,weather:'\ud750\ub9bc'}}
    };
    const reportSites={
      songjeong:{lat:35.1789,lng:129.2008,area:'\uc1a1\uc815\ud574\uc218\uc695\uc7a5 \uc911\uc559 \ud574\ubcc0 \uad6c\uac04'},
      dadaepo:{lat:35.0476,lng:128.9660,area:'\ub2e4\ub300\ud3ec\ud574\uc218\uc695\uc7a5 \uc911\uc559 \ud574\ubcc0 \uad6c\uac04'},
      haeundae:{lat:35.1588,lng:129.1603,area:'\ud574\uc6b4\ub300\ud574\uc218\uc695\uc7a5 \uc911\uc559 \ud574\ubcc0 \uad6c\uac04'},
      gwangalli:{lat:35.1535,lng:129.1190,area:'\uad11\uc548\ub9ac\ud574\uc218\uc695\uc7a5 \uc911\uc559 \ud574\ubcc0 \uad6c\uac04'},
      songdo:{lat:35.0782,lng:129.0207,area:'\uc1a1\ub3c4\ud574\uc218\uc695\uc7a5 \uc911\uc559 \ud574\ubcc0 \uad6c\uac04'}
    };
    const ui={brand:'\ubc14\ub2e4 \ucf55\ucf55',headline:'\ud604\uc7ac \ubc14\ub2e4 \uc0c1\ud0dc\ub97c<br>\ud55c\ub208\uc5d0 \ud655\uc778\ud558\uc138\uc694.',sub:'\ubd80\uc0b0 \ud574\uc548\uac00\uc758 \uc218\uc628, \ud30c\uace0, \ud48d\uc18d, \uccb4\uac10\uc628\ub3c4\ub97c \uc54c\ub824\ub4dc\ub9bd\ub2c8\ub2e4.',weather:'\ud604\uc7ac \uae30\uc0c1\u00b7\ud574\uc591 \uc0c1\ud0dc',weatherIntro:'\uc2e4\uc2dc\uac04 \ub370\uc774\ud130\ub97c \ubc1b\uc544 \ud45c\uc2dc\ud558\ub294 \uacf5\uac04\uc785\ub2c8\ub2e4.',notice:'\ud604\uc7ac \uac12\uc740 \uc608\uc2dc \ub370\uc774\ud130\uc785\ub2c8\ub2e4. \uc2e4\uc81c \uad00\uce21 API\ub97c \uc5f0\uacb0\ud55c \ud6c4 \uc0ac\uc6a9\ud558\uc138\uc694.',risk:'\ud604\uc7ac \uc0c1\ud669 \ubc14\ud0d5 \uc704\ud5d8 \ud310\ub2e8',riskText:'\uc704\ud5d8\ub3c4 \ud310\ub2e8 \uc870\uac74\uc744 \ucd94\uac00\ud558\uba74 \uc5ec\uae30\uc5d0 \uacb0\uacfc\uac00 \ud45c\uc2dc\ub429\ub2c8\ub2e4.',pending:'\ud310\ub2e8 \uaddc\uce59 \uc900\ube44 \uc911',rule:'\ucd94\ud6c4 \ucd94\uac00\ud560 \uc704\ud5d8 \ud310\ub2e8 \uc870\uac74\ubb38',ruleText:'\uc704\ud5d8 \ud310\ub2e8 \ud568\uc218\uc5d0 \uc544\ub798 \uc870\uac74\ubb38\uc744 \ucd94\uac00\ud558\uba74 \ud604\uc7ac \ub370\uc774\ud130\ub85c \uc704\ud5d8\uc5d0 \ub300\ud55c \uc548\ub0b4\ub97c \ud45c\uc2dc\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.',footer:'\ubc14\ub2e4 \ucf55\ucf55 | \ubd80\uc0b0 \ud574\uc548\uac00 \uc548\uc804 \uc548\ub0b4 \uc11c\ube44\uc2a4'};
    function setText(id,value){document.getElementById(id).textContent=value}
    function formatObservationTime(value){
      const text=String(value||'');
      const match=text.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})$/);
      if(!match)return text;
      return Number(match[1])+'\ub144 '+Number(match[2])+'\uc6d4 '+Number(match[3])+'\uc77c '+Number(match[4])+'\uc2dc '+Number(match[5])+'\ubd84';
    }
    let queryNumber=0, demoReport=false,currentLocation=null,safetyMap=null,reportMarker=null,currentMarker=null,locationLine=null;
    async function getRealtime(beach,beachKey){
      try{
        const saved=await fetch('./data/realtime-data.json?updated='+Date.now(),{cache:'no-store'}).then(response=>{if(!response.ok)throw Error();return response.json()});
        if(saved.beaches?.[beachKey])return saved.beaches[beachKey];
      }catch(error){console.warn('Saved real-time data is unavailable. Showing demo data.',error)}
      const config=window.KMA_API_CONFIG;
      if(config?.proxyUrl){
        try{const url=new URL(config.proxyUrl);url.searchParams.set('lat',beach.lat);url.searchParams.set('lng',beach.lng);url.searchParams.set('beach',beach.name);const response=await fetch(url,{headers:config.serviceKey?{'x-api-key':config.serviceKey}:{}});if(!response.ok)throw Error();return await response.json()}catch(error){console.warn('KMA API request failed. Showing demo data.',error)}
      }
      const change=(queryNumber++%3)-1;
      return {region:beach.name,observed_at:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),water_temperature:+(beach.sample.water_temperature+change*.2).toFixed(1),wave_height:+Math.max(.1,beach.sample.wave_height+change*.1).toFixed(1),wind_speed:+Math.max(.1,beach.sample.wind_speed+change*.4).toFixed(1),apparent_temperature:+(beach.sample.apparent_temperature+change).toFixed(1),weather:beach.sample.weather};
    }
    // Add future safety guidance conditions here when needed.
    function status(value,caution,danger){return value>=danger?'danger':value>=caution?'caution':'safe'}
    function jellyfishGuidance(temperature){
      if(temperature<20)return {label:'\ub0ae\uc74c',style:'jellyfish-low',text:'20\u2103 \ubbf8\ub9cc \uad6c\uac04\uc740 \uc218\uc628 \uae30\ubc18 \ud574\ud30c\ub9ac \uc8fc\uc758 \uac00\ub2a5\uc131\uc774 \ub0ae\uc2b5\ub2c8\ub2e4.'};
      if(temperature<22)return {label:'\uc8fc\uc758',style:'jellyfish-caution',text:'20~22\u2103 \uad6c\uac04\uc73c\ub85c, \uacfc\uac70 \ucd9c\ud604 \uacbd\ud5a5\uc774 \uc99d\uac00\ud558\ub294 \uc218\uc628\ub300\uc785\ub2c8\ub2e4.'};
      return {label:'\ub192\uc74c',style:'jellyfish-high',text:'22\u2103 \uc774\uc0c1 \uad6c\uac04\uc73c\ub85c, \uc81c\uacf5\ub41c \ubd84\uc11d\uc5d0\uc11c \ucd9c\ud604\uc728\uc774 20\u2103 \ubbf8\ub9cc\ubcf4\ub2e4 \ud06c\uac8c \ub192\uc558\ub358 \uc218\uc628\ub300\uc785\ub2c8\ub2e4.'};
    }
    function windGuidance(wind){
      if(wind<5)return '\ud604\uc7ac '+wind+' m/s: \uc57d\ud55c \ubc14\ub78c\uc785\ub2c8\ub2e4.';
      if(wind<10)return '\ud604\uc7ac '+wind+' m/s: \uc57d\uac04 \uac15\ud55c \ubc14\ub78c\uc785\ub2c8\ub2e4.';
      if(wind<15)return '\ud604\uc7ac '+wind+' m/s: \uac15\ud55c \ubc14\ub78c\uc73c\ub85c \uc8fc\uc758\uac00 \ud544\uc694\ud569\ub2c8\ub2e4.';
      return '\ud604\uc7ac '+wind+' m/s: \uac15\ud55c \ubc14\ub78c\uc73c\ub85c \ud574\uc548\uac00 \ud65c\ub3d9\uc5d0 \uc8fc\uc758\ud558\uc138\uc694.';
    }
    function distanceAndDirection(from,to){
      const radius=6371000,toRadians=value=>value*Math.PI/180,latitude=toRadians(to.lat-from.lat),longitude=toRadians(to.lng-from.lng);
      const a=Math.sin(latitude/2)**2+Math.cos(toRadians(from.lat))*Math.cos(toRadians(to.lat))*Math.sin(longitude/2)**2;
      const distance=Math.round(2*radius*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
      const angle=(Math.atan2(Math.sin(longitude)*Math.cos(toRadians(to.lat)),Math.cos(toRadians(from.lat))*Math.sin(toRadians(to.lat))-Math.sin(toRadians(from.lat))*Math.cos(toRadians(to.lat))*Math.cos(longitude))*180/Math.PI+360)%360;
      const directions=['\ubd81','\ubd81\ub3d9','\ub3d9','\ub0a8\ub3d9','\ub0a8','\ub0a8\uc11c','\uc11c','\ubd81\uc11c'];
      return {distance,direction:directions[Math.round(angle/45)%8]};
    }
    function distanceLabel(distance){return distance>=1000?(distance/1000).toFixed(1)+'㎞':distance+'m'}
    function cautionMessage(distance){
      if(distance<300)return '\uc2e0\uace0 \uc704\uce58\uac00 \ud604\uc7ac \uc704\uce58\uc640 \ub9e4\uc6b0 \uac00\uae5d\uc2b5\ub2c8\ub2e4. \ud574\ub2f9 \uad6c\uac04 \uc811\uadfc\uacfc \uc785\uc218\uc5d0 \uc8fc\uc758\ud558\uc138\uc694.';
      if(distance<1000)return '\uc2e0\uace0 \uc704\uce58\uac00 \ud604\uc7ac \uc704\uce58 \uc778\uadfc\uc5d0 \uc788\uc2b5\ub2c8\ub2e4. \uc9c0\ub3c4\uc758 \uc8fc\ud669\uc0c9 \ud540 \ubc29\ud5a5\uc744 \ud655\uc778\ud558\uc138\uc694.';
      return '\uc2e0\uace0 \uc704\uce58\uac00 \ud604\uc7ac \uc704\uce58\uc5d0\uc11c \uc77c\uc815 \uac70\ub9ac \ub5a8\uc5b4\uc838 \uc788\uc2b5\ub2c8\ub2e4. \ud574\ub2f9 \uad6c\uac04 \ubc29\ubb38 \uc804\uc5d0 \uc0c1\ud0dc\ub97c \ud655\uc778\ud558\uc138\uc694.';
    }
    function locationMessage(reportLocation){
      if(!currentLocation)return '\ub0b4 \uc704\uce58 \ud655\uc778\uc744 \ub204\ub974\uba74 \ud604\uc7ac \uc704\uce58\uc640 \uc120\ud0dd \ud574\uc218\uc695\uc7a5 \uc2e0\uace0 \uc704\uce58\uc758 \uac70\ub9ac\u00b7\ubc29\ud5a5\uc744 \uc54c\ub824\ub4dc\ub9bd\ub2c8\ub2e4. \uc704\uce58\ub294 \uc800\uc7a5\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.';
      const result=distanceAndDirection(currentLocation,reportLocation);
      return '\ud604\uc7ac \uc704\uce58\uc5d0\uc11c \uc2e0\uace0 \uc2dc\uc5f0 \uc704\uce58\uae4c\uc9c0 '+result.direction+' \uc57d '+distanceLabel(result.distance)+'\uc785\ub2c8\ub2e4. '+cautionMessage(result.distance);
    }
    function updateSafetyMap(reportSite,beachName,hasReport){
      if(!window.L)return;
      const reportLocation=[reportSite.lat,reportSite.lng];
      if(!safetyMap){
        safetyMap=L.map('reportMap',{scrollWheelZoom:false}).setView(reportLocation,15);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(safetyMap);
      }
      if(reportMarker)reportMarker.remove();
      reportMarker=hasReport?L.marker(reportLocation).addTo(safetyMap).bindPopup(beachName+' \ud574\ud30c\ub9ac \uc2e0\uace0 \uc2dc\uc5f0 \uc704\uce58').openPopup():null;
      if(currentMarker){currentMarker.remove();currentMarker=null}if(locationLine){locationLine.remove();locationLine=null}
      if(currentLocation){
        const userPoint=[currentLocation.lat,currentLocation.lng];
        currentMarker=L.marker(userPoint,{icon:L.divIcon({className:'',html:'<span class="gps-pin"></span>',iconSize:[24,24],iconAnchor:[12,24]})}).addTo(safetyMap).bindPopup('\ub0b4 \ud604\uc7ac \uc704\uce58');
        if(hasReport){locationLine=L.polyline([userPoint,reportLocation],{color:'#087ea7',dashArray:'6 7'}).addTo(safetyMap);safetyMap.fitBounds(L.latLngBounds([userPoint,reportLocation]).pad(.25));}
        else safetyMap.setView(userPoint,15);
      }else safetyMap.setView(reportLocation,15);
      setTimeout(()=>safetyMap.invalidateSize(),0);
    }
    async function render(){
      const beachKey=document.getElementById('beachSelect').value,beach=beaches[beachKey],reportSite=reportSites[beachKey],data=await getRealtime(beach,beachKey),jellyfish=jellyfishGuidance(data.water_temperature);

      setText('subheadline',ui.sub);setText('weatherTitle',ui.weather);setText('weatherIntro',ui.weatherIntro);setText('beachLabel','\ud574\uc218\uc695\uc7a5 \uc120\ud0dd');setText('queryButton','\uc870\ud68c');

      setText('dataNotice',data.source&&data.source.includes('KMA')?'\uae30\uc0c1\uccad \ud574\uc0c1 \uad00\uce21\uacfc AWS \ub9e4\ubd84 \uad00\uce21, \ucd08\ub2e8\uae30\uc608\ubcf4 \ub370\uc774\ud130\ub85c \uac31\uc2e0\ub41c \uac12\uc785\ub2c8\ub2e4.':'KMA API \uc124\uc815 \uc804\uc774\ubbc0\ub85c \uc120\ud0dd\ud55c \uc9c0\uc5ed\uc758 \uc608\uc2dc \ub370\uc774\ud130\ub97c \ud45c\uc2dc\ud569\ub2c8\ub2e4.');
      document.getElementById('jellyfishPanel').innerHTML='<p class="panel-kicker">\uc218\uc628 \uae30\ubc18 \uc608\uce21</p><h3>\ud604\uc7ac '+data.water_temperature+'\u2103 <span class="jellyfish-level '+jellyfish.style+'">\ud574\ud30c\ub9ac \uc8fc\uc758 '+jellyfish.label+'</span></h3><p>'+jellyfish.text+'</p><p>\uc2e4\uc81c \ucd9c\ud604\uc740 \uc2e0\uace0\u00b7\uacf5\uc2dd \uad00\uce21 \uc815\ubcf4\ub85c \ud655\uc778\ud574\uc57c \ud569\ub2c8\ub2e4.</p>';
      const reportStatus=document.getElementById('reportStatus'),reportButton=document.getElementById('reportButton');
      setText('reportTitle',data.region+' \ud574\ud30c\ub9ac \uc2e0\uace0 \uc2dc\uc5f0');
      if(demoReport){reportStatus.innerHTML='<strong>\uc2e0\uace0 \ud655\uc778 \uc911</strong><div class="report-meta">'+reportSite.area+' (\uc2dc\uc5f0 \uc704\uce58)<br>\ud574\ud30c\ub9ac \uc81c\ubcf4 1\uac74 \u00b7 10\ubd84 \uc804 \uc811\uc218 (\uc2dc\uc5f0)<br>'+(!currentLocation?'\ub0b4 \uc704\uce58 \ud655\uc778 \ud6c4 \uac70\ub9ac\ubcc4 \uc8fc\uc758 \uc548\ub0b4\uac00 \ud45c\uc2dc\ub429\ub2c8\ub2e4.':locationMessage(reportSite))+'</div>';reportButton.textContent='\uc2e0\uace0 \uc2dc\uc5f0 \uc885\ub8cc';}else{reportStatus.innerHTML='<strong>\uc2e0\uace0 \uc5c6\uc74c</strong><div class="report-meta">\uc2e4\uc81c \uc2e0\uace0 \ub370\uc774\ud130\ub294 \uc544\uc9c1 \uc5f0\ub3d9\ub418\uc9c0 \uc54a\uc558\uc2b5\ub2c8\ub2e4.<br>\uc544\ub798 \ubc84\ud2bc\uc73c\ub85c '+data.region+' \uc2e0\uace0\uac00 \ub4e4\uc5b4\uc654\uc744 \ub54c\uc758 \ud45c\uc2dc\ub97c \ubcfc \uc218 \uc788\uc2b5\ub2c8\ub2e4.</div>';reportButton.textContent=data.region+' \uc2e0\uace0 \uc2dc\uc5f0 \ubcf4\uae30';}
      setText('locationStatus',locationMessage(reportSite));
      updateSafetyMap(reportSite,data.region,demoReport);
      setText('footer',ui.footer);setText('windInfo',windGuidance(data.wind_speed));
      const values=[['\uc218\uc628',data.water_temperature+' \u2103',status(data.water_temperature,25,28)],['\ud30c\uace0',data.wave_height+' m',status(data.wave_height,.8,1.3)],['\ud48d\uc18d <span class="wind-mark">!</span>',data.wind_speed+' m/s',status(data.wind_speed,5,8),'wind-metric'],['\uccb4\uac10\uc628\ub3c4',data.apparent_temperature+' \u2103',status(data.apparent_temperature,28,32)],['\ub0a0\uc528',data.weather,'safe']];
      document.getElementById('metrics').innerHTML=values.map(x=>'<div class="metric '+x[2]+' '+(x[3]||'')+'"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');
    }
    const beachSelect=document.getElementById('beachSelect');beachSelect.innerHTML=Object.entries(beaches).map(x=>'<option value="'+x[0]+'">'+x[1].name+'</option>').join('');document.getElementById('queryButton').addEventListener('click',render);document.getElementById('reportButton').addEventListener('click',()=>{demoReport=!demoReport;render()});document.getElementById('locationButton').addEventListener('click',()=>{const button=document.getElementById('locationButton');if(!navigator.geolocation){setText('locationStatus','\uc774 \ube0c\ub77c\uc6b0\uc800\ub294 \uc704\uce58 \ud655\uc778\uc744 \uc9c0\uc6d0\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.');return}button.textContent='\uc704\uce58 \ud655\uc778 \uc911...';navigator.geolocation.getCurrentPosition(position=>{currentLocation={lat:position.coords.latitude,lng:position.coords.longitude};button.textContent='\ub0b4 \uc704\uce58 \ub2e4\uc2dc \ud655\uc778';render()},()=>{button.textContent='\ub0b4 \uc704\uce58 \ud655\uc778';setText('locationStatus','\uc704\uce58 \uad8c\ud55c\uc774 \ud5c8\uc6a9\ub418\uc9c0 \uc54a\uc558\uc2b5\ub2c8\ub2e4. \ubc30\ud3ec\ub41c \uc6f9\uc0ac\uc774\ud2b8\uc5d0\uc11c \uc704\uce58 \uad8c\ud55c\uc744 \ud5c8\uc6a9\ud574 \uc8fc\uc138\uc694.')},{enableHighAccuracy:true,timeout:10000,maximumAge:30000})});render()
  </script>
