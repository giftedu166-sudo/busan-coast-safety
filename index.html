<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="부산 해안가 실시간 기상과 해양 정보를 보여 주는 안전 안내 서비스">
  <title>Busan Coast Safety</title>
  <style>
    :root{--navy:#07364f;--blue:#087ea7;--sky:#eaf8fb;--bg:#f4fafb;--line:#d5e7ec;--ink:#152c36;--muted:#59717c;--orange:#d97818;--green:#19754f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Noto Sans KR",sans-serif}.hero{padding:38px 20px 88px;background:linear-gradient(125deg,#062f46,#087fa9);color:#fff}.wrap{width:min(100%,1000px);margin:auto}.brand{font-weight:900;font-size:clamp(2.15rem,5vw,3.45rem);line-height:1.05;letter-spacing:-.07em}.brand b{color:#9cecf5}.eyebrow{margin-top:4px;color:#9cecf5;letter-spacing:.1em;font-size:clamp(.9rem,2vw,1.15rem);font-weight:850}h1{margin:28px 0 10px;font-size:clamp(2.15rem,5vw,3.6rem);line-height:1.16;letter-spacing:-.06em}.hero p{max-width:620px;margin:0}.main{width:min(calc(100% - 32px),1000px);margin:-42px auto 46px}.card{padding:clamp(20px,4vw,30px);border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 10px 25px #07364f0b}.title-row{display:flex;align-items:center;gap:10px}.title-row h2{margin:0;font-size:1.42rem;letter-spacing:-.04em}.icon{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--sky);color:var(--blue);font-weight:900}.intro{margin:7px 0 19px;color:var(--muted)}.updated{padding:10px 12px;border-radius:10px;background:#f5fafb;color:var(--muted);font-size:.86rem}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.metric{padding:15px;border:1px solid var(--line);border-radius:13px}.metric span{display:block;color:var(--muted);font-size:.84rem}.metric b{font-size:1.35rem}.metric small{display:block;margin-top:3px;color:var(--muted)}.risk{margin-top:18px;background:linear-gradient(135deg,#fff,#e8f8fa)}.risk-top{display:flex;justify-content:space-between;align-items:start;gap:20px}.risk-top h2{margin:0}.risk-top p{margin:5px 0;color:var(--muted)}.pending{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff2dc;color:#875200;font-size:.85rem;font-weight:800}.score{font-size:2.5rem;font-weight:900;line-height:1;color:var(--orange)}.rule-box{margin-top:20px;padding:18px;border-radius:13px;background:#fff;border:1px dashed #8bc4d3}.rule-box h3{margin:0 0 6px;font-size:1rem}.rule-box p{margin:0;color:var(--muted);font-size:.92rem}.rule-list{padding-left:20px;margin:10px 0 0;color:var(--muted);font-size:.9rem}.notice{margin-top:18px;padding:13px;border-left:5px solid var(--blue);background:var(--sky);color:#31535f;font-size:.9rem}footer{text-align:center;padding:20px;color:var(--muted);font-size:.8rem}@media(max-width:650px){.hero{padding-top:28px}.main{margin-top:-28px}.metrics{grid-template-columns:1fr 1fr}.risk-top{display:block}.score{margin-top:16px}}
    .beach-label{display:block;margin-bottom:6px;font-size:.9rem;font-weight:800}.beach-select{width:min(100%,360px);padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
    .beach-control{display:flex;gap:8px;align-items:center}.query-button{padding:11px 17px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}.metric.safe{border-color:#85d3aa;background:#effbf4}.metric.caution{border-color:#efb36d;background:#fff5e8}.metric.danger{border-color:#efa29e;background:#fff3f2}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><div class="brand" id="brand"></div><div class="eyebrow">BUSAN COAST SAFETY</div><h1 id="headline"></h1><p id="subheadline"></p></div></header>
  <main class="main">
    <section class="card"><div class="title-row"><div class="icon">1</div><h2 id="weatherTitle"></h2></div><p class="intro" id="weatherIntro"></p><label class="beach-label" for="beachSelect" id="beachLabel"></label><div class="beach-control"><select id="beachSelect" class="beach-select"></select><button id="queryButton" class="query-button"></button></div><div class="updated" id="updated"></div><div class="metrics" id="metrics"></div><div class="notice" id="dataNotice"></div></section>
    <section class="card risk"><div class="title-row"><div class="icon">2</div><h2 id="riskTitle"></h2></div><div class="risk-top"><div><p id="riskText"></p><span class="pending" id="pending"></span></div></div><div class="rule-box"><h3 id="ruleTitle"></h3><p id="ruleText"></p><ul class="rule-list" id="ruleList"></ul></div></section>
  </main><footer id="footer"></footer>
  <script src="./kma-api-config.js"></script>
  <script>
    // The only input source for the site: current weather and ocean observations.
    const beaches={
      songjeong:{name:'\uc1a1\uc815\ud574\uc218\uc695\uc7a5',lat:35.1786,lng:129.2005,sample:{water_temperature:26.8,wave_height:.9,wind_speed:5.6,apparent_temperature:30,weather:'\ub9d1\uc74c'}},
      dadaepo:{name:'\ub2e4\ub300\ud3ec\ud574\uc218\uc695\uc7a5',lat:35.0473,lng:128.9657,sample:{water_temperature:25.8,wave_height:.5,wind_speed:3.6,apparent_temperature:29,weather:'\ub9d1\uc74c'}},
      haeundae:{name:'\ud574\uc6b4\ub300\ud574\uc218\uc695\uc7a5',lat:35.1588,lng:129.1603,sample:{water_temperature:27.4,wave_height:1.4,wind_speed:8.2,apparent_temperature:32,weather:'\ub9d1\uc74c'}},
      gwangalli:{name:'\uad11\uc548\ub9ac\ud574\uc218\uc695\uc7a5',lat:35.1532,lng:129.1187,sample:{water_temperature:26.7,wave_height:.8,wind_speed:5.1,apparent_temperature:30,weather:'\uad6c\ub984 \uc870\uae08'}},
      songdo:{name:'\uc1a1\ub3c4\ud574\uc218\uc695\uc7a5',lat:35.0779,lng:129.0204,sample:{water_temperature:26.2,wave_height:.7,wind_speed:4.4,apparent_temperature:29,weather:'\ud750\ub9bc'}}
    };
    const ui={brand:'\ubc14\ub2e4 \ucf55\ucf55',headline:'\ud604\uc7ac \ubc14\ub2e4 \uc0c1\ud0dc\ub97c<br>\ud55c\ub208\uc5d0 \ud655\uc778\ud558\uc138\uc694.',sub:'\ubd80\uc0b0 \ud574\uc548\uac00\uc758 \uc218\uc628, \ud30c\uace0, \ud48d\uc18d, \uccb4\uac10\uc628\ub3c4\ub97c \uc54c\ub824\ub4dc\ub9bd\ub2c8\ub2e4.',weather:'\ud604\uc7ac \uae30\uc0c1\u00b7\ud574\uc591 \uc0c1\ud0dc',weatherIntro:'\uc2e4\uc2dc\uac04 \ub370\uc774\ud130\ub97c \ubc1b\uc544 \ud45c\uc2dc\ud558\ub294 \uacf5\uac04\uc785\ub2c8\ub2e4.',notice:'\ud604\uc7ac \uac12\uc740 \uc608\uc2dc \ub370\uc774\ud130\uc785\ub2c8\ub2e4. \uc2e4\uc81c \uad00\uce21 API\ub97c \uc5f0\uacb0\ud55c \ud6c4 \uc0ac\uc6a9\ud558\uc138\uc694.',risk:'\ud604\uc7ac \uc0c1\ud669 \ubc14\ud0d5 \uc704\ud5d8 \ud310\ub2e8',riskText:'\uc704\ud5d8\ub3c4 \ud310\ub2e8 \uc870\uac74\uc744 \ucd94\uac00\ud558\uba74 \uc5ec\uae30\uc5d0 \uacb0\uacfc\uac00 \ud45c\uc2dc\ub429\ub2c8\ub2e4.',pending:'\ud310\ub2e8 \uaddc\uce59 \uc900\ube44 \uc911',rule:'\ucd94\ud6c4 \ucd94\uac00\ud560 \uc704\ud5d8 \ud310\ub2e8 \uc870\uac74\ubb38',ruleText:'\uc704\ud5d8 \ud310\ub2e8 \ud568\uc218\uc5d0 \uc544\ub798 \uc870\uac74\ubb38\uc744 \ucd94\uac00\ud558\uba74 \ud604\uc7ac \ub370\uc774\ud130\ub85c \uc704\ud5d8\uc5d0 \ub300\ud55c \uc548\ub0b4\ub97c \ud45c\uc2dc\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.',footer:'\ubc14\ub2e4 \ucf55\ucf55 | \ubd80\uc0b0 \ud574\uc548\uac00 \uc548\uc804 \uc548\ub0b4 \uc11c\ube44\uc2a4'};
    function setText(id,value){document.getElementById(id).textContent=value}
    let queryNumber=0;
    async function getRealtime(beach,beachKey){
      try{
        const saved=await fetch('./data/realtime-data.json?updated='+Date.now(),{cache:'no-store'}).then(response=>{if(!response.ok)throw Error();return response.json()});
        if(saved.beaches?.[beachKey])return saved.beaches[beachKey];
      }catch(error){console.warn('Saved real-time data is unavailable. Showing demo data.',error)}
      const config=window.KMA_API_CONFIG;
      if(config?.proxyUrl){
        try{const url=new URL(config.proxyUrl);url.searchParams.set('lat',beach.lat);url.searchParams.set('lng',beach.lng);url.searchParams.set('beach',beach.name);const response=await fetch(url,{headers:config.serviceKey?{'x-api-key':config.serviceKey}:{}});if(!response.ok)throw Error();return await response.json()}catch(error){console.warn('KMA API request failed. Showing demo data.',error)}
      }
      const change=(queryNumber++%3)-1;
      return {region:beach.name,observed_at:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),water_temperature:+(beach.sample.water_temperature+change*.2).toFixed(1),wave_height:+Math.max(.1,beach.sample.wave_height+change*.1).toFixed(1),wind_speed:+Math.max(.1,beach.sample.wind_speed+change*.4).toFixed(1),apparent_temperature:+(beach.sample.apparent_temperature+change).toFixed(1),weather:beach.sample.weather};
    }
    // Add future safety guidance conditions here when needed.
    function status(value,caution,danger){return value>=danger?'danger':value>=caution?'caution':'safe'}
    async function render(){const beachKey=document.getElementById('beachSelect').value,beach=beaches[beachKey],data=await getRealtime(beach,beachKey);document.getElementById('brand').innerHTML=ui.brand;document.getElementById('headline').innerHTML=ui.headline;setText('subheadline',ui.sub);setText('weatherTitle',ui.weather);setText('weatherIntro',ui.weatherIntro);setText('beachLabel','\ud574\uc218\uc695\uc7a5 \uc120\ud0dd');setText('queryButton','\uc870\ud68c');setText('updated','\uad00\uce21 \uc9c0\uc5ed: '+data.region+' | \uad00\uce21 \uc2dc\uac01: '+data.observed_at);setText('dataNotice',data.source&&data.source.includes('KMA')?'\uae30\uc0c1\uccad \ud574\uc0c1 \uad00\uce21\uacfc AWS \ub9e4\ubd84 \uad00\uce21, \ucd08\ub2e8\uae30\uc608\ubcf4 \ub370\uc774\ud130\ub85c \uac31\uc2e0\ub41c \uac12\uc785\ub2c8\ub2e4.':'KMA API \uc124\uc815 \uc804\uc774\ubbc0\ub85c \uc120\ud0dd\ud55c \uc9c0\uc5ed\uc758 \uc608\uc2dc \ub370\uc774\ud130\ub97c \ud45c\uc2dc\ud569\ub2c8\ub2e4.');setText('riskTitle',ui.risk);setText('riskText','\ud604\uc7ac \uc0c1\ud0dc\ub97c \ud655\uc778\ud55c \ub4a4 \ud544\uc694\ud55c \uc704\ud5d8 \ud310\ub2e8 \uc870\uac74\uc744 \ucd94\uac00\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.');setText('pending','\ud310\ub2e8 \uaddc\uce59 \uc900\ube44 \uc911');setText('ruleTitle',ui.rule);setText('ruleText',ui.ruleText);setText('footer',ui.footer);const values=[['\uc218\uc628',data.water_temperature+' \u2103',status(data.water_temperature,25,28)],['\ud30c\uace0',data.wave_height+' m',status(data.wave_height,.8,1.3)],['\ud48d\uc18d',data.wind_speed+' m/s',status(data.wind_speed,5,8)],['\uccb4\uac10\uc628\ub3c4',data.apparent_temperature+' \u2103',status(data.apparent_temperature,28,32)],['\ub0a0\uc528',data.weather,'safe']];document.getElementById('metrics').innerHTML=values.map(x=>'<div class="metric '+x[2]+'"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');document.getElementById('ruleList').innerHTML=['\ucd08\ub85d\uc0c9: \uc548\uc804','\uc8fc\ud669\uc0c9: \uc8fc\uc758','\ube68\uac04\uc0c9: \uc704\ud5d8'].map(x=>'<li>'+x+'</li>').join('')}
    const beachSelect=document.getElementById('beachSelect');beachSelect.innerHTML=Object.entries(beaches).map(x=>'<option value="'+x[0]+'">'+x[1].name+'</option>').join('');document.getElementById('queryButton').addEventListener('click',render);render()
  </script>
</body></html>
